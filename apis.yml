name: Conductor AI
description: 'Conductor AI (ConductorAI) is a defense- and intelligence-focused artificial
  intelligence company that turns disparate policy documents and organizational knowledge
  into agentic decision trees to accelerate document approvals and complex regulated
  workflows. Its Conduit platform combines agentic search across structured and unstructured
  data (Office documents, HTML, images, and video), workflow orchestration that encodes
  policy and expertise into AI-augmented decision steps, and review-and-collaboration
  tooling for redactions and compliance checks. Applications include ITAR/EAR export-control
  review, e-discovery and investigations, security-classification review, FOIA processing,
  and foreign-disclosure decisions. Conductor AI serves U.S. government and commercial
  customers and is backed by Lux Capital and Andreessen Horowitz. The company exposes
  no public developer API; integration is delivered as an enterprise platform.'
